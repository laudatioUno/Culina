name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite, mbstring, iconv, zlib
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
      - name: Tests
        run: php tests/run.php
      - name: Build package
        id: package
        env:
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          VERSION=$(sed -nE "s/.*CULINA_VERSION = '([^']+)'.*/\1/p" src/version.php)
          NAME="culina-$VERSION-${SHA::7}.zip"
          zip -qr "$NAME" . \
            -x '.git/*' '.github/*' 'tests/*' 'data/*.sqlite*' 'data/sessions/*' 'config.php'
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.name }}
          archive: false
          retention-days: 30
